---
name: Build and release installer ISO

on:
  workflow_dispatch:

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: pubcode.archuser.org/universalblue/bazzite-firebadnofire
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  BIB_CACHE_VOLUME: bazzite-firebadnofire-bib-image-cache-v1
  BIB_CACHE_LOCK_VOLUME: bazzite-firebadnofire-bib-image-cache-lock-v1
  DOCKER_SMOKE_IMAGE: docker.io/library/hello-world:latest@sha256:5e23090353324d887c48ad5e5c56d294eab81588df9605b07d1afe895f9cc8f8

jobs:
  prepare:
    name: Resolve stable image digest and warm cache
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
      daemon_id: ${{ steps.image.outputs.daemon_id }}

    steps:
      - name: Bootstrap Docker tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v sudo >/dev/null; then
            SUDO=sudo
          elif [[ "$(id -u)" == 0 ]]; then
            SUDO=""
          else
            echo "error: the bare Ubuntu job needs sudo or a root user" >&2
            exit 1
          fi
          ${SUDO} apt-get update
          ${SUDO} apt-get install -y --no-install-recommends \
            ca-certificates \
            docker-buildx \
            docker.io \
            python3

      - name: Verify Docker access
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "error: installer ISO builds only support x86_64" >&2
            exit 1
          }
          docker info >/dev/null
          docker buildx version
          docker run --rm "${DOCKER_SMOKE_IMAGE}"
          docker run --rm --privileged --entrypoint /usr/bin/bash \
            "${BIB_IMAGE}" -c \
            'command -v podman; command -v flock; command -v bootc-image-builder'

      - name: Resolve the stable image digest
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_json="$(docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}:stable" --format '{{json .Manifest}}')"
          digest="$(python3 -c \
            'import json, sys; print(json.load(sys.stdin)["digest"])' \
            <<<"${manifest_json}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "error: registry returned an invalid stable digest: ${digest}" >&2
            exit 1
          }
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${digest}" >/dev/null
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          daemon_id="$(docker info --format '{{.ID}}')"
          [[ -n "${daemon_id}" ]]
          echo "daemon_id=${daemon_id}" >> "${GITHUB_OUTPUT}"
          echo "Installer ISO will use ${IMAGE_REPOSITORY}@${digest}"

      - name: Warm the persistent bootc source-image cache
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          source_image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          cache_container="bib-cache-warm-iso-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            if docker container inspect "${cache_container}" >/dev/null 2>&1 && \
              ! docker rm -f "${cache_container}" >/dev/null; then
              echo "warning: could not remove ${cache_container}" >&2
            fi
          }
          trap cleanup EXIT

          docker volume create \
            --label bib-cache.role=image-store \
            --label bib-cache.version=1 \
            "${BIB_CACHE_VOLUME}" >/dev/null
          docker volume create \
            --label bib-cache.role=lock \
            --label bib-cache.version=1 \
            "${BIB_CACHE_LOCK_VOLUME}" >/dev/null
          [[ "$(docker volume inspect --format '{{index .Labels "bib-cache.role"}}' \
            "${BIB_CACHE_VOLUME}")" == image-store ]]
          [[ "$(docker volume inspect --format '{{index .Labels "bib-cache.version"}}' \
            "${BIB_CACHE_VOLUME}")" == 1 ]]
          [[ "$(docker volume inspect --format '{{index .Labels "bib-cache.role"}}' \
            "${BIB_CACHE_LOCK_VOLUME}")" == lock ]]
          [[ "$(docker volume inspect --format '{{index .Labels "bib-cache.version"}}' \
            "${BIB_CACHE_LOCK_VOLUME}")" == 1 ]]

          docker create --name "${cache_container}" \
            --privileged \
            --network host \
            --security-opt label=type:unconfined_t \
            --env "SOURCE_IMAGE=${source_image}" \
            --volume "${BIB_CACHE_VOLUME}:/var/cache/bib-image-store" \
            --volume "${BIB_CACHE_LOCK_VOLUME}:/var/cache/bib-cache-lock" \
            --entrypoint /usr/bin/bash \
            "${BIB_IMAGE}" -c '
              set -Eeuo pipefail
              exec 9>/var/cache/bib-cache-lock/store.lock
              echo "Waiting for exclusive bootc source-cache lock"
              flock --exclusive 9
              echo "Persistent cache before pull:"
              podman --root /var/cache/bib-image-store \
                --runroot /run/bib-cache-podman \
                --storage-driver overlay images --digests --no-trunc
              echo "Refreshing exact source image ${SOURCE_IMAGE}"
              podman --root /var/cache/bib-image-store \
                --runroot /run/bib-cache-podman \
                --storage-driver overlay pull "${SOURCE_IMAGE}"
              podman --root /var/cache/bib-image-store \
                --runroot /run/bib-cache-podman \
                --storage-driver overlay image exists "${SOURCE_IMAGE}"
              podman --root /var/cache/bib-image-store \
                --runroot /run/bib-cache-podman \
                --storage-driver overlay image inspect --format \
                "Cached source: id={{.Id}} digest={{.Digest}}" "${SOURCE_IMAGE}"
              echo "Persistent cache after pull:"
              podman --root /var/cache/bib-image-store \
                --runroot /run/bib-cache-podman \
                --storage-driver overlay images --digests --no-trunc
              du -sh /var/cache/bib-image-store
            ' >/dev/null
          docker start --attach "${cache_container}"

  iso:
    name: Installer ISO (x86_64)
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Bootstrap the bare Ubuntu runner
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v sudo >/dev/null; then
            SUDO=sudo
          elif [[ "$(id -u)" == 0 ]]; then
            SUDO=""
          else
            echo "error: the bare Ubuntu job needs sudo or a root user" >&2
            exit 1
          fi
          ${SUDO} apt-get update
          ${SUDO} apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            docker-buildx \
            docker.io \
            git \
            xz-utils

          readonly node_version=v24.17.0
          readonly node_archive="node-${node_version}-linux-x64.tar.xz"
          readonly node_sha256=ab343a1b747c7cbf3630dfd7dbf818c5423fab2eb4f5ad1afc896f6bd121a917
          curl --fail --location --silent --show-error \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/${node_version}/${node_archive}"
          printf '%s  %s\n' "${node_sha256}" "/tmp/${node_archive}" | \
            sha256sum --check --strict
          ${SUDO} tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1
          node --version

      - name: Check out the exact triggering revision
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GITHUB_WORKSPACE:?Forgejo did not provide GITHUB_WORKSPACE}"
          : "${GITHUB_REF:?Forgejo did not provide GITHUB_REF}"
          : "${GITHUB_SHA:?Forgejo did not provide GITHUB_SHA}"
          repository="${GITHUB_SERVER_URL:-https://pubcode.archuser.org}/${GITHUB_REPOSITORY:-universalblue/bazzite-firebadnofire}.git"
          cd "${GITHUB_WORKSPACE}"
          git init
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${repository}"
          else
            git remote add origin "${repository}"
          fi
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach "${GITHUB_SHA}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]

      - name: Verify privileged x86_64 Docker runner
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "error: installer ISO builds only support x86_64" >&2
            exit 1
          }
          command -v docker >/dev/null || {
            echo "error: the Ubuntu job container does not have a Docker client" >&2
            exit 1
          }
          docker --version
          if [[ -n "${DOCKER_HOST:-}" ]]; then
            echo "Docker endpoint: configured through DOCKER_HOST"
          elif [[ -S /var/run/docker.sock ]]; then
            stat --format='Docker socket: mode=%a uid=%u gid=%g' \
              /var/run/docker.sock
          else
            echo "error: no DOCKER_HOST or Docker UNIX socket is available in the job container" >&2
            exit 1
          fi
          if ! docker info >/dev/null; then
            echo "error: the Docker client is installed, but this job container cannot access a Docker daemon" >&2
            echo "error: configure an isolated DinD endpoint in Forgejo Runner; do not make the host socket world-writable" >&2
            id >&2
            if [[ -e /var/run/docker.sock ]]; then
              stat --format='error: socket mode=%a uid=%u gid=%g' \
                /var/run/docker.sock >&2
            fi
            exit 1
          fi
          docker info --format \
            'Docker daemon: version={{.ServerVersion}} storage-driver={{.Driver}} root={{.DockerRootDir}}'
          docker buildx version
          docker run --rm "${DOCKER_SMOKE_IMAGE}"
          docker run --rm --privileged "${BIB_IMAGE}" --version
          docker run --rm --privileged --entrypoint /usr/bin/bash \
            "${BIB_IMAGE}" -c \
            'command -v podman; command -v flock; command -v bootc-image-builder'

      - name: Verify the shared handoff daemon before building
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          HANDOFF_DAEMON_ID: ${{ needs.prepare.outputs.daemon_id }}
          HANDOFF_FORMATS: iso
        run: bash scripts/disk-handoff.sh check

      - name: Build installer ISO
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          source_image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          output_volume="bib-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-anaconda-iso"
          storage_volume="bib-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-anaconda-iso"
          container="bib-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-anaconda-iso"
          helper="${container}-copy"
          storage_helper="${container}-storage"
          diagnostic_helper="${container}-diagnostics"
          cleanup() {
            for cleanup_container in \
              "${container}" "${helper}" "${storage_helper}" "${diagnostic_helper}"; do
              if docker container inspect "${cleanup_container}" >/dev/null 2>&1 && \
                ! docker rm -f "${cleanup_container}" >/dev/null; then
                echo "warning: could not remove ${cleanup_container}" >&2
              fi
            done
            for cleanup_volume in "${output_volume}" "${storage_volume}"; do
              if docker volume inspect "${cleanup_volume}" >/dev/null 2>&1 && \
                ! docker volume rm "${cleanup_volume}" >/dev/null; then
                echo "warning: could not remove ${cleanup_volume}" >&2
              fi
            done
          }
          diagnose_storage() {
            docker create --name "${diagnostic_helper}" \
              --privileged \
              --network host \
              --security-opt label=type:unconfined_t \
              --env "SOURCE_IMAGE=${source_image}" \
              --volume "${storage_volume}:/var/lib/containers/storage" \
              --volume "${BIB_CACHE_VOLUME}:/var/cache/bib-image-store:ro" \
              --volume "${BIB_CACHE_LOCK_VOLUME}:/var/cache/bib-cache-lock" \
              --entrypoint /usr/bin/bash \
              "${BIB_IMAGE}" -c '
                set -Eeuo pipefail
                exec 9>/var/cache/bib-cache-lock/store.lock
                flock --shared 9
                podman info --debug
                podman images --digests --no-trunc
                podman image exists "${SOURCE_IMAGE}"
                podman image inspect --format \
                  "id={{.Id}} digest={{.Digest}}" "${SOURCE_IMAGE}"
                find /var/lib/containers/storage \
                  -mindepth 1 -maxdepth 2 -type d -print | sort | sed -n "1,80p"
                df -hT /var/lib/containers/storage
                du -sh /var/cache/bib-image-store
              ' >/dev/null
            docker cp disk_config/ci-storage.conf \
              "${diagnostic_helper}:/etc/containers/storage.conf"
            docker start --attach "${diagnostic_helper}"
          }
          on_exit() {
            status=$?
            if [[ "${status}" -ne 0 ]] && \
              docker volume inspect "${storage_volume}" >/dev/null 2>&1; then
              echo "error: ISO build failed; collecting container-storage diagnostics" >&2
              if ! diagnose_storage; then
                echo "warning: container-storage diagnostics also failed" >&2
              fi
            fi
            cleanup
            exit "${status}"
          }
          trap on_exit EXIT

          docker volume create "${output_volume}" >/dev/null
          docker volume create "${storage_volume}" >/dev/null
          [[ "$(docker volume inspect --format '{{index .Labels "bib-cache.role"}}' \
            "${BIB_CACHE_VOLUME}")" == image-store ]]
          [[ "$(docker volume inspect --format '{{index .Labels "bib-cache.role"}}' \
            "${BIB_CACHE_LOCK_VOLUME}")" == lock ]]

          docker create --name "${storage_helper}" \
            --privileged \
            --network host \
            --security-opt label=type:unconfined_t \
            --env "SOURCE_IMAGE=${source_image}" \
            --volume "${storage_volume}:/var/lib/containers/storage" \
            --volume "${BIB_CACHE_VOLUME}:/var/cache/bib-image-store:ro" \
            --volume "${BIB_CACHE_LOCK_VOLUME}:/var/cache/bib-cache-lock" \
            --entrypoint /usr/bin/bash \
            "${BIB_IMAGE}" -c '
              set -Eeuo pipefail
              exec 9>/var/cache/bib-cache-lock/store.lock
              flock --shared 9
              podman image exists "${SOURCE_IMAGE}"
              podman image inspect --format \
                "Cache reuse: id={{.Id}} digest={{.Digest}}" "${SOURCE_IMAGE}"
              podman images --filter readonly=true --digests --no-trunc
            ' >/dev/null
          docker cp disk_config/ci-storage.conf \
            "${storage_helper}:/etc/containers/storage.conf"
          docker start --attach "${storage_helper}"
          docker rm "${storage_helper}" >/dev/null

          docker create --name "${container}" \
            --privileged \
            --network host \
            --security-opt label=type:unconfined_t \
            --env "SOURCE_IMAGE=${source_image}" \
            --volume "${output_volume}:/output" \
            --volume "${storage_volume}:/var/lib/containers/storage" \
            --volume "${BIB_CACHE_VOLUME}:/var/cache/bib-image-store:ro" \
            --volume "${BIB_CACHE_LOCK_VOLUME}:/var/cache/bib-cache-lock" \
            --entrypoint /usr/bin/bash \
            "${BIB_IMAGE}" -c '
              set -Eeuo pipefail
              exec 9>/var/cache/bib-cache-lock/store.lock
              echo "Waiting for shared bootc source-cache lock"
              flock --shared 9
              podman image exists "${SOURCE_IMAGE}"
              echo "Building installer ISO from cached exact source ${SOURCE_IMAGE}"
              bootc-image-builder \
                --type anaconda-iso \
                --rootfs btrfs \
                --use-librepo=true \
                "${SOURCE_IMAGE}"
            ' >/dev/null
          docker cp disk_config/ci-storage.conf \
            "${container}:/etc/containers/storage.conf"
          docker cp disk_config/iso.toml "${container}:/config.toml"
          docker start --attach "${container}"

          mkdir -p output release-input
          docker create --name "${helper}" --volume "${output_volume}:/output:ro" \
            --entrypoint /usr/bin/true "${BIB_IMAGE}" >/dev/null
          docker cp "${helper}:/output/." output/
          [[ -s output/bootiso/install.iso ]] || {
            echo "error: bootc-image-builder did not produce output/bootiso/install.iso" >&2
            find output -maxdepth 3 -type f -print >&2
            exit 1
          }
          short_sha="${GITHUB_SHA:0:12}"
          digest_hex="${IMAGE_DIGEST#sha256:}"
          install -m 0644 output/bootiso/install.iso \
            "release-input/bazzite-firebadnofire-${short_sha}-${digest_hex:0:12}.iso"

      - name: Stage installer ISO on the dedicated Docker daemon
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          HANDOFF_DAEMON_ID: ${{ needs.prepare.outputs.daemon_id }}
          HANDOFF_FORMATS: iso
        run: bash scripts/disk-handoff.sh stage iso

  release:
    name: Sign and publish installer ISO release
    needs: [prepare, iso]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
      HANDOFF_DAEMON_ID: ${{ needs.prepare.outputs.daemon_id }}
      HANDOFF_FORMATS: iso

    steps:
      - name: Bootstrap release tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v sudo >/dev/null; then
            SUDO=sudo
          elif [[ "$(id -u)" == 0 ]]; then
            SUDO=""
          else
            echo "error: the bare Ubuntu job needs sudo or a root user" >&2
            exit 1
          fi
          ${SUDO} apt-get update
          ${SUDO} apt-get install -y --no-install-recommends \
            ca-certificates curl docker.io git gnupg jq xz-utils

          readonly node_version=v24.17.0
          readonly node_archive="node-${node_version}-linux-x64.tar.xz"
          readonly node_sha256=ab343a1b747c7cbf3630dfd7dbf818c5423fab2eb4f5ad1afc896f6bd121a917
          curl --fail --location --silent --show-error \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/${node_version}/${node_archive}"
          printf '%s  %s\n' "${node_sha256}" "/tmp/${node_archive}" | \
            sha256sum --check --strict
          ${SUDO} tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1
          node --version
          docker info >/dev/null

      - name: Check out the exact triggering revision
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GITHUB_WORKSPACE:?Forgejo did not provide GITHUB_WORKSPACE}"
          repository="${GITHUB_SERVER_URL:-https://pubcode.archuser.org}/${GITHUB_REPOSITORY:-universalblue/bazzite-firebadnofire}.git"
          cd "${GITHUB_WORKSPACE}"
          git init
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${repository}"
          else
            git remote add origin "${repository}"
          fi
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach "${GITHUB_SHA}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]

      - name: Require the ISO build and verify local handoff
        shell: bash
        env:
          ISO_RESULT: ${{ needs.iso.result }}
        run: |
          set -Eeuo pipefail
          [[ "${ISO_RESULT}" == success ]] || {
            echo "error: the ISO build must succeed before signing or publishing" >&2
            exit 1
          }
          bash scripts/disk-handoff.sh collect

      - name: Assemble and checksum the ISO release
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          digest_hex="${IMAGE_DIGEST#sha256:}"
          release_id="${short_sha}-${digest_hex:0:12}"
          iso="bazzite-firebadnofire-${release_id}.iso"
          [[ -s "release/${iso}" ]]
          [[ "$(find release -maxdepth 1 -type f | wc -l)" -eq 1 ]] || {
            echo "error: expected only the unsigned ISO before checksumming" >&2
            find release -maxdepth 1 -type f -print >&2
            exit 1
          }
          (
            cd release
            sha256sum "${iso}" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "iso=${iso}" >> "${GITHUB_OUTPUT}"

      - name: Sign and cryptographically verify every downloadable asset
        shell: bash
        env:
          GPG_KEY_B64: ${{ secrets.GPG_KEY_B64 }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}
        run: bash scripts/sign-release-artifacts.sh release sig

      - name: Prove exact signed release completeness and write release notes
        shell: bash
        env:
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          ISO_FILE: ${{ steps.metadata.outputs.iso }}
        run: |
          set -Eeuo pipefail
          expected=(
            "${ISO_FILE}"
            "${ISO_FILE}.sig"
            SHA256SUMS
            SHA256SUMS.sig
          )
          for asset in "${expected[@]}"; do
            [[ -s "release/${asset}" ]] || {
              echo "error: required signed release asset is missing or empty: ${asset}" >&2
              exit 1
            }
          done
          mapfile -d '' -t release_files < <(
            find release -maxdepth 1 -type f -print0 | sort -z
          )
          [[ "${#release_files[@]}" -eq "${#expected[@]}" ]] || {
            echo "error: release directory contains an unexpected asset" >&2
            find release -maxdepth 1 -type f -print >&2
            exit 1
          }
          for file in "${release_files[@]}"; do
            if [[ "${file}" == *.sig ]]; then
              [[ -s "${file%.sig}" ]] || {
                echo "error: signature has no payload: ${file}" >&2
                exit 1
              }
            else
              [[ -s "${file}.sig" ]] || {
                echo "error: unsigned release asset: ${file}" >&2
                exit 1
              }
            fi
          done

          cat > release-notes.md <<EOF
          # bazzite-firebadnofire installer ISO

          ISO: ${ISO_FILE}
          Source OCI image: ${IMAGE_REPOSITORY}@${IMAGE_DIGEST}
          Repository revision: ${GITHUB_SHA}

          Verify the ISO checksum:

              sha256sum --check --strict SHA256SUMS

          Every downloadable file has a detached binary OpenPGP signature with
          the .sig extension. Import and verify the expected signing key:

              gpg --keyserver hkps://keys.openpgp.org --recv-keys 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
              gpg --fingerprint 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
              gpg --verify ./${ISO_FILE}.sig ./${ISO_FILE}
              gpg --verify ./SHA256SUMS.sig ./SHA256SUMS

          The complete expected fingerprint is:

              7D6E F134 D851 C8DA 0862 D974 94F3 1AF3 74E2 EE3C

          A Good signature is insufficient unless the full fingerprint matches.
          These OpenPGP signatures authenticate the downloadable files. Cosign
          separately authenticates the source OCI image digest; after cloning
          this repository, verify it with:

              cosign verify --key cosign.pub ${IMAGE_REPOSITORY}@${IMAGE_DIGEST}
          EOF

      - name: Publish the Forgejo ISO release
        uses: https://code.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          url: ${{ forgejo.server_url }}
          repo: ${{ forgejo.repository }}
          token: ${{ forgejo.token }}
          tag: iso-${{ steps.metadata.outputs.release_id }}
          title: bazzite-firebadnofire ISO ${{ steps.metadata.outputs.release_id }}
          sha: ${{ github.sha }}
          release-dir: release
          release-notes-file: release-notes.md
          override: true
          hide-archive-link: true

      - name: Clean up this run's ISO handoff volume
        if: ${{ always() }}
        shell: bash
        run: bash scripts/disk-handoff.sh cleanup
