---
name: Validate, build, publish, and sign

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: pubcode.archuser.org
  IMAGE_PATH: universalblue/bazzite-firebadnofire
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PATH: firebadnofire/bazzite-firebadnofire
  DOCKER_SMOKE_IMAGE: docker.io/library/hello-world:latest@sha256:5e23090353324d887c48ad5e5c56d294eab81588df9605b07d1afe895f9cc8f8
  MIN_RUNNER_FREE_BYTES: "64424509440"
  MIN_PUBLISH_FREE_BYTES: "42949672960"

jobs:
  image:
    name: x86_64 image
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Bootstrap the bare Ubuntu runner
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v sudo >/dev/null; then
            SUDO=sudo
          elif [[ "$(id -u)" == 0 ]]; then
            SUDO=""
          else
            echo "error: the bare Ubuntu job needs sudo or a root user" >&2
            exit 1
          fi
          ${SUDO} apt-get update
          ${SUDO} apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            docker-buildx \
            docker.io \
            git \
            python3-toml \
            python3-yaml \
            ripgrep \
            shellcheck

      - name: Check out the exact triggering revision
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GITHUB_WORKSPACE:?Forgejo did not provide GITHUB_WORKSPACE}"
          : "${GITHUB_REF:?Forgejo did not provide GITHUB_REF}"
          : "${GITHUB_SHA:?Forgejo did not provide GITHUB_SHA}"
          repository="${GITHUB_SERVER_URL:-https://pubcode.archuser.org}/${GITHUB_REPOSITORY:-universalblue/bazzite-firebadnofire}.git"
          cd "${GITHUB_WORKSPACE}"
          git init
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${repository}"
          else
            git remote add origin "${repository}"
          fi
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach "${GITHUB_SHA}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]

      - name: Verify runner capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "error: this workflow only supports an x86_64 runner" >&2
            exit 1
          }
          command -v docker >/dev/null || {
            echo "error: the Ubuntu job container does not have a Docker client" >&2
            exit 1
          }
          docker --version
          if [[ -n "${DOCKER_HOST:-}" ]]; then
            echo "Docker endpoint: configured through DOCKER_HOST"
          elif [[ -S /var/run/docker.sock ]]; then
            stat --format='Docker socket: mode=%a uid=%u gid=%g' \
              /var/run/docker.sock
          else
            echo "error: no DOCKER_HOST or Docker UNIX socket is available in the job container" >&2
            exit 1
          fi
          if ! docker info >/dev/null; then
            echo "error: the Docker client is installed, but this job container cannot access a Docker daemon" >&2
            echo "error: configure an isolated DinD endpoint in Forgejo Runner; do not make the host socket world-writable" >&2
            id >&2
            if [[ -e /var/run/docker.sock ]]; then
              stat --format='error: socket mode=%a uid=%u gid=%g' \
                /var/run/docker.sock >&2
            fi
            exit 1
          fi
          docker buildx version
          docker run --rm "${DOCKER_SMOKE_IMAGE}"

          echo "Runner resource snapshot before the image build:"
          df -hT /
          df -ih /
          free -h
          if [[ -r /sys/fs/cgroup/memory.events ]]; then
            echo "Job cgroup memory events:"
            cat /sys/fs/cgroup/memory.events
          fi
          docker info --format \
            'Docker daemon: ID={{.ID}} driver={{.Driver}} root={{.DockerRootDir}} containers={{.Containers}} images={{.Images}}'
          available_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d '[:space:]')"
          [[ "${available_bytes}" =~ ^[0-9]+$ ]] || {
            echo "error: could not determine free bytes on the Docker backing filesystem" >&2
            exit 1
          }
          if ((available_bytes < MIN_RUNNER_FREE_BYTES)); then
            echo "error: the runner has ${available_bytes} free bytes; at least ${MIN_RUNNER_FREE_BYTES} are required before this large image build" >&2
            echo "error: reclaim only identified stale runner artifacts; do not broad-prune the shared disk-image cache" >&2
            exit 1
          fi

      - name: Validate repository
        shell: bash
        run: bash scripts/validate-static.sh

      - name: Build image
        shell: bash
        run: |
          set -Eeuo pipefail
          source bazzite-firebadnofire.env
          short_sha="${GITHUB_SHA:0:12}"
          created="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          run_attempt="${GITHUB_RUN_ATTEMPT:-1}"
          local_image="localhost/${IMAGE_NAME}:ci-${GITHUB_RUN_ID}-${run_attempt}"

          docker buildx build --load \
            --pull \
            --platform linux/amd64 \
            --label "org.opencontainers.image.created=${created}" \
            --label "org.opencontainers.image.description=${IMAGE_DESC}" \
            --label "org.opencontainers.image.documentation=${REPO_URL}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${REPO_URL}" \
            --label "org.opencontainers.image.title=${IMAGE_NAME}" \
            --label "org.opencontainers.image.url=${REPO_URL}" \
            --label "org.opencontainers.image.vendor=${REPO_ORGANIZATION}" \
            --label "org.opencontainers.image.version=${DEFAULT_TAG}.${short_sha}" \
            --tag "${local_image}" \
            --file Containerfile \
            .
          echo "LOCAL_IMAGE=${local_image}" >> "${GITHUB_ENV}"

      - name: Inspect image contract
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint /usr/bin/bash "${LOCAL_IMAGE}" -c '
            set -Eeuo pipefail
            bootc container lint --fatal-warnings
            export XDG_RUNTIME_DIR=/tmp/hyprland-verify
            install -d -m 0700 "${XDG_RUNTIME_DIR}"
            rpm -q foot hyprland hyprland-guiutils hypridle hyprlock hyprpolkitagent \
              xdg-desktop-portal-hyprland libvirt-daemon-kvm qemu-kvm \
              virt-manager plasma-login-manager bootc
            /usr/libexec/bazzite-firebadnofire-include-packages verify \
              /usr/share/bazzite-firebadnofire/include.txt
            test -s /usr/share/bazzite-firebadnofire/hyprland.lua
            test -s /etc/containers/registries.conf.d/20-bazzite-firebadnofire-mirror.conf
            grep -Fqx "prefix = \"pubcode.archuser.org/universalblue/bazzite-firebadnofire\"" /etc/containers/registries.conf.d/20-bazzite-firebadnofire-mirror.conf
            grep -Fqx "location = \"ghcr.io/firebadnofire/bazzite-firebadnofire\"" /etc/containers/registries.conf.d/20-bazzite-firebadnofire-mirror.conf
            grep -A4 -F "[[registry]]" /etc/containers/registries.conf.d/20-bazzite-firebadnofire-mirror.conf | \
              grep -Fqx "location = \"pubcode.archuser.org/universalblue/bazzite-firebadnofire\""
            grep -A4 -F "[[registry.mirror]]" /etc/containers/registries.conf.d/20-bazzite-firebadnofire-mirror.conf | \
              grep -Fqx "location = \"ghcr.io/firebadnofire/bazzite-firebadnofire\""
            Hyprland --verify-config --i-am-really-stupid \
              --config /usr/share/bazzite-firebadnofire/hyprland.lua
            test -x /usr/bin/looking-glass-client
            test -x /usr/libexec/xdg-desktop-portal-hyprland
            test -x /usr/libexec/hyprpolkitagent
            test -x /usr/bin/foot
            test -x /usr/bin/start-hyprland
            test -x /usr/bin/hyprland-dialog
            test -x /usr/libexec/bazzite-firebadnofire-start-hyprland
            test -x /usr/libexec/bazzite-firebadnofire-screenshot
            test -L /etc/os-release
            test "$(readlink /etc/os-release)" = ../usr/lib/os-release
            grep -Fqx "NAME=\"firebadnofire-bazzite\"" /etc/os-release
            grep -Fqx "PRETTY_NAME=\"firebadnofire-bazzite\"" /etc/os-release
            grep -Fqx "ID=bazzite" /etc/os-release
            grep -Fqx "ID_LIKE=\"fedora\"" /etc/os-release
            test -f /usr/share/wayland-sessions/hyprland.desktop
            grep -qx "Exec=/usr/libexec/bazzite-firebadnofire-start-hyprland" \
              /usr/share/wayland-sessions/hyprland.desktop
            grep -qx "TryExec=/usr/bin/start-hyprland" \
              /usr/share/wayland-sessions/hyprland.desktop
            grep -qx "DesktopNames=Hyprland" \
              /usr/share/wayland-sessions/hyprland.desktop
            test "$(systemctl is-enabled libvirtd.service)" = enabled
            test "$(systemctl is-enabled podman.socket)" = enabled
            test "$(systemctl is-enabled plasmalogin.service)" = enabled
            test "$(readlink -f /etc/systemd/system/display-manager.service)" = \
              /usr/lib/systemd/system/plasmalogin.service
            ! ldd /usr/bin/looking-glass-client | grep -q "not found"
          '

      - name: Log in to the Forgejo registry
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REGISTRY_USERNAME: firebadnofire
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -Eeuo pipefail
          : "${REGISTRY_USERNAME:?REGISTRY_USERNAME is not configured}"
          : "${REGISTRY_TOKEN:?configure the REGISTRY_TOKEN repository secret with write:package scope}"
          if ! printf '%s' "${REGISTRY_TOKEN}" | docker login "${IMAGE_REGISTRY}" \
            --username "${REGISTRY_USERNAME}" --password-stdin; then
            echo "error: Forgejo registry login failed" >&2
            echo "error: REGISTRY_TOKEN must be a PAT with write:package scope whose owner may publish packages for universalblue" >&2
            exit 1
          fi

      - name: Push the commit traceability tag and resolve its canonical digest
        id: publish
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          source bazzite-firebadnofire.env
          source scripts/oci-publication.sh
          source scripts/retry-once.sh
          short_sha="${GITHUB_SHA:0:12}"
          image_ref="${IMAGE_REGISTRY}/${IMAGE_PATH}"
          traceability_tag="sha-${short_sha}"

          trap 'echo "error: publication shell received TERM; runner shutdown or job cancellation interrupted the Forgejo push" >&2; exit 143' TERM
          trap 'echo "error: publication shell received INT; the Forgejo push was interrupted" >&2; exit 130' INT

          available_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d '[:space:]')"
          [[ "${available_bytes}" =~ ^[0-9]+$ ]] || {
            echo "error: could not determine free bytes at the publication boundary" >&2
            exit 1
          }
          if ((available_bytes < MIN_PUBLISH_FREE_BYTES)); then
            echo "error: publication requires ${MIN_PUBLISH_FREE_BYTES} free bytes, but only ${available_bytes} remain after the build" >&2
            report_publish_failure "publication storage preflight" "${image_ref}:${traceability_tag}"
            exit 1
          fi

          docker tag "${LOCAL_IMAGE}" "${image_ref}:${traceability_tag}"
          if ! retry_once push_reference "${image_ref}:${traceability_tag}"; then
            echo "error: registry push failed for ${image_ref}:${traceability_tag}" >&2
            echo "error: verify REGISTRY_TOKEN has write:package scope and its owner may publish packages for universalblue" >&2
            exit 1
          fi

          if ! digest="$(retry_once resolve_digest "${image_ref}:${traceability_tag}")"; then
            echo "error: registry could not resolve the published traceability tag" >&2
            exit 1
          fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "error: registry returned an invalid image digest: ${digest}" >&2
            exit 1
          }

          {
            echo "digest=${digest}"
            echo "image_ref=${image_ref}"
            echo "traceability_tag=${traceability_tag}"
          } >> "${GITHUB_OUTPUT}"
          trap - TERM INT

      - name: Install pinned Cosign
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly version=v3.1.2
          readonly expected=f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
          curl --fail --location --silent --show-error \
            --output /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${version}/cosign-linux-amd64"
          printf '%s  %s\n' "${expected}" /tmp/cosign | sha256sum --check --strict
          chmod 0755 /tmp/cosign
          /tmp/cosign version

      - name: Sign and verify the published digest
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          : "${COSIGN_PRIVATE_KEY:?configure the COSIGN_PRIVATE_KEY repository secret}"
          : "${COSIGN_PASSWORD:?configure the COSIGN_PASSWORD repository secret}"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

          /tmp/cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${PUBLISHED_IMAGE}@${DIGEST}"
          /tmp/cosign verify --key cosign.pub "${PUBLISHED_IMAGE}@${DIGEST}"

      - name: Publish stream and immutable tags
        id: publish_tags
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image_ref }}
          TRACEABILITY_TAG: ${{ steps.publish.outputs.traceability_tag }}
        run: |
          set -Eeuo pipefail
          source bazzite-firebadnofire.env
          source scripts/oci-publication.sh
          source scripts/retry-once.sh
          short_sha="${GITHUB_SHA:0:12}"
          build_date="$(date --utc +%Y%m%d)"
          digest_hex="${DIGEST#sha256:}"
          immutable_tag="${DEFAULT_TAG}-${build_date}-${short_sha}-${digest_hex:0:12}"
          tags=("${immutable_tag}" "${DEFAULT_TAG}")

          trap 'echo "error: publication shell received TERM; runner shutdown or job cancellation interrupted Forgejo tag publication" >&2; exit 143' TERM
          trap 'echo "error: publication shell received INT; Forgejo tag publication was interrupted" >&2; exit 130' INT

          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "immutable_tag=${immutable_tag}" >> "${GITHUB_OUTPUT}"
          for tag in "${tags[@]}"; do
            docker tag "${LOCAL_IMAGE}" "${PUBLISHED_IMAGE}:${tag}"
            if ! retry_once push_reference "${PUBLISHED_IMAGE}:${tag}"; then
              echo "error: registry push failed for ${PUBLISHED_IMAGE}:${tag}" >&2
              exit 1
            fi
          done

          for tag in "${TRACEABILITY_TAG}" "${tags[@]}"; do
            if ! tag_digest="$(retry_once resolve_digest "${PUBLISHED_IMAGE}:${tag}")"; then
              echo "error: registry could not resolve ${PUBLISHED_IMAGE}:${tag}" >&2
              exit 1
            fi
            [[ "${tag_digest}" == "${DIGEST}" ]] || {
              echo "error: ${PUBLISHED_IMAGE}:${tag} resolves to ${tag_digest}, expected ${DIGEST}" >&2
              exit 1
            }
          done

          /tmp/cosign verify --key cosign.pub "${PUBLISHED_IMAGE}@${DIGEST}"
          echo "Published immutable tag: ${PUBLISHED_IMAGE}:${immutable_tag}"
          trap - TERM INT

      - name: Mirror signed image to GHCR
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          GH_KEY: ${{ secrets.GH_KEY }}
          GH_USERNAME: firebadnofire
          IMMUTABLE_TAG: ${{ steps.publish_tags.outputs.immutable_tag }}
          TRACEABILITY_TAG: ${{ steps.publish.outputs.traceability_tag }}
        run: |
          set -Eeuo pipefail
          source scripts/retry-once.sh

          : "${GH_KEY:?configure the GH_KEY repository secret with write:packages scope}"
          : "${GH_USERNAME:?GH_USERNAME is not configured}"
          : "${IMMUTABLE_TAG:?the Forgejo immutable tag output is missing}"
          : "${TRACEABILITY_TAG:?the Forgejo traceability tag output is missing}"
          : "${COSIGN_PRIVATE_KEY:?configure the COSIGN_PRIVATE_KEY repository secret}"
          : "${COSIGN_PASSWORD:?configure the COSIGN_PASSWORD repository secret}"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

          ghcr_image="${GHCR_REGISTRY}/${GHCR_IMAGE_PATH}"
          readonly ghcr_image

          resolve_digest() {
            local reference="$1"
            local manifest_json
            if ! manifest_json="$(docker buildx imagetools inspect \
              "${reference}" --format '{{json .Manifest}}')"; then
              echo "error: GHCR could not resolve ${reference}" >&2
              return 1
            fi
            python3 -c \
              'import json, sys; print(json.load(sys.stdin)["digest"])' \
              <<<"${manifest_json}"
          }

          mirror_to_ghcr() {
            local anonymous_config
            local tag
            local tag_digest

            if ! printf '%s' "${GH_KEY}" | docker login "${GHCR_REGISTRY}" \
              --username "${GH_USERNAME}" --password-stdin; then
              echo "error: GHCR login failed; GH_KEY must be a classic PAT with write:packages scope" >&2
              return 1
            fi

            if ! docker tag "${LOCAL_IMAGE}" "${ghcr_image}:${TRACEABILITY_TAG}"; then
              echo "error: could not tag the local image for GHCR" >&2
              return 1
            fi
            if ! docker push "${ghcr_image}:${TRACEABILITY_TAG}"; then
              echo "error: GHCR traceability-tag push failed" >&2
              return 1
            fi

            if ! tag_digest="$(resolve_digest "${ghcr_image}:${TRACEABILITY_TAG}")"; then
              return 1
            fi
            if [[ "${tag_digest}" != "${DIGEST}" ]]; then
              echo "error: GHCR digest ${tag_digest} does not match Forgejo digest ${DIGEST}" >&2
              return 1
            fi

            if /tmp/cosign verify --key cosign.pub \
              "${ghcr_image}@${DIGEST}" >/dev/null 2>&1; then
              echo "GHCR digest already has a valid Cosign signature; skipping duplicate signing"
            elif ! /tmp/cosign sign --yes \
              --new-bundle-format=false \
              --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY \
              "${ghcr_image}@${DIGEST}"; then
              echo "error: signing the GHCR digest failed" >&2
              return 1
            fi
            if ! /tmp/cosign verify --key cosign.pub "${ghcr_image}@${DIGEST}"; then
              echo "error: GHCR Cosign verification failed" >&2
              return 1
            fi

            for tag in "${IMMUTABLE_TAG}" stable; do
              if ! docker tag "${LOCAL_IMAGE}" "${ghcr_image}:${tag}"; then
                echo "error: could not tag the local image as ${ghcr_image}:${tag}" >&2
                return 1
              fi
              if ! docker push "${ghcr_image}:${tag}"; then
                echo "error: GHCR push failed for ${ghcr_image}:${tag}" >&2
                return 1
              fi
            done

            for tag in "${TRACEABILITY_TAG}" "${IMMUTABLE_TAG}" stable; do
              if ! tag_digest="$(resolve_digest "${ghcr_image}:${tag}")"; then
                return 1
              fi
              if [[ "${tag_digest}" != "${DIGEST}" ]]; then
                echo "error: ${ghcr_image}:${tag} resolves to ${tag_digest}, expected ${DIGEST}" >&2
                return 1
              fi
            done

            if ! anonymous_config="$(mktemp -d)"; then
              echo "error: could not create an isolated Docker configuration for the public GHCR check" >&2
              return 1
            fi
            if ! DOCKER_CONFIG="${anonymous_config}" docker buildx imagetools inspect \
              "${ghcr_image}@${DIGEST}" >/dev/null; then
              rm -rf -- "${anonymous_config}"
              echo "error: anonymous GHCR inspection failed" >&2
              echo "error: make the package public in GitHub package settings, link it to firebadnofire/bazzite-firebadnofire, and rerun" >&2
              return 1
            fi
            rm -rf -- "${anonymous_config}"

            if ! /tmp/cosign verify --key cosign.pub "${ghcr_image}@${DIGEST}"; then
              echo "error: final GHCR Cosign verification failed" >&2
              return 1
            fi
            echo "Mirrored and verified public GHCR image: ${ghcr_image}@${DIGEST}"
          }

          retry_once mirror_to_ghcr

      - name: Clean up this run's loaded image
        if: always()
        shell: bash
        env:
          IMMUTABLE_TAG: ${{ steps.publish_tags.outputs.immutable_tag }}
        run: |
          set -Eeuo pipefail
          if ! command -v docker >/dev/null || [[ -z "${LOCAL_IMAGE:-}" ]]; then
            echo "No loaded image is available for run-local cleanup"
            exit 0
          fi
          if ! local_image_id="$(docker image inspect "${LOCAL_IMAGE}" --format '{{.Id}}' 2>/dev/null)"; then
            echo "The run-local image is already absent: ${LOCAL_IMAGE}"
            exit 0
          fi

          source bazzite-firebadnofire.env
          short_sha="${GITHUB_SHA:0:12}"
          traceability_tag="sha-${short_sha}"
          forgejo_image="${IMAGE_REGISTRY}/${IMAGE_PATH}"
          ghcr_image="${GHCR_REGISTRY}/${GHCR_IMAGE_PATH}"
          references=(
            "${forgejo_image}:${traceability_tag}"
            "${ghcr_image}:${traceability_tag}"
          )
          if [[ -n "${IMMUTABLE_TAG:-}" ]]; then
            references+=(
              "${forgejo_image}:${IMMUTABLE_TAG}"
              "${ghcr_image}:${IMMUTABLE_TAG}"
            )
          fi
          references+=("${forgejo_image}:${DEFAULT_TAG}" "${ghcr_image}:stable")

          for reference in "${references[@]}"; do
            if reference_id="$(docker image inspect "${reference}" --format '{{.Id}}' 2>/dev/null)"; then
              if [[ "${reference_id}" != "${local_image_id}" ]]; then
                echo "Skipping local tag owned by another image: ${reference}"
                continue
              fi
              if ! docker image rm "${reference}"; then
                echo "warning: could not remove run-local tag ${reference}" >&2
              fi
            fi
          done
          if docker image inspect "${LOCAL_IMAGE}" >/dev/null 2>&1; then
            if ! docker image rm "${LOCAL_IMAGE}"; then
              echo "warning: could not remove run-local image ${LOCAL_IMAGE}" >&2
            fi
          fi
          echo "Completed exact run-local image cleanup; shared caches were not pruned"

      - name: Log out of registries
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if ! command -v docker >/dev/null; then
            echo "warning: Docker was unavailable, so there are no registry sessions to close" >&2
            exit 0
          fi
          for registry in "${IMAGE_REGISTRY}" "${GHCR_REGISTRY}"; do
            if ! docker logout "${registry}"; then
              echo "warning: logout failed for ${registry} after the job completed" >&2
            fi
          done
