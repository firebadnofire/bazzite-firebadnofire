# Keep pubcode.archuser.org as the logical/canonical image identity while
# trying it first and GHCR second. containers/image always tries entries named
# "mirror" before "location", so the physical fields are intentionally
# arranged in the opposite order from their product roles.
[[registry]]
prefix = "pubcode.archuser.org/universalblue/bazzite-firebadnofire"
location = "ghcr.io/firebadnofire/bazzite-firebadnofire"
insecure = false

[[registry.mirror]]
location = "pubcode.archuser.org/universalblue/bazzite-firebadnofire"
insecure = false
pull-from-mirror = "all"
