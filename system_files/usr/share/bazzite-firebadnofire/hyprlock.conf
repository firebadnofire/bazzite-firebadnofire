general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1a1b26ff)
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(24283bff)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = Authentication failed
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c0caf5ff)
    font_size = 72
    position = 0, 100
    halign = center
    valign = center
}
